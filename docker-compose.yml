# === BioShield AI - orquestracao de desenvolvimento ===
# Sobe banco + backend + frontend (ai_edge opcional). Ajuste conforme os
# Dockerfiles evoluirem.
version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bioshield
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # OBS: o schema.sql atual e um .md com o DDL dentro de um bloco ```sql.
      # Extraia o SQL puro antes de usar o init automatico abaixo:
      # - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  backend:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "5173:5173"

  # ai_edge:
  #   build: ./ai_edge
  #   env_file: .env
  #   depends_on: [backend]

volumes:
  dbdata:
